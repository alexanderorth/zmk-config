# Seeed XIAO nRF52840 dongle for the Sofle Choc Pro, no display.

CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Dongles stay powered over USB, so no deep sleep.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_TIMEOUT=30000

# No display or RGB hardware on this build.
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=n

# Second HID interface reporting left/right half battery to the host.
# Read by the zmk-split-battery GNOME extension.
CONFIG_ZMK_SPLIT_BATTERY_HID_REPORT=y
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_USB_COMPOSITE_DEVICE=y
CONFIG_HID_INTERRUPT_EP_MPS=32
CONFIG_ZMK_WPM=y
