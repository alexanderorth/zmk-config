name: Release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware

      - name: Package firmware
        run: |
          cd firmware
          zip -r "../zmk-firmware-${GITHUB_REF_NAME}.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" zmk-firmware-*.zip --generate-notes --title "${GITHUB_REF_NAME}"
