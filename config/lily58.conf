# Shared options for both Lily58 halves; role-specific overrides live
# in `lily58_left.conf` and `lily58_right.conf` so we can tailor USB and
# BLE settings separately.
#
# Display is not configured here: a build that uses a display shield
# (e.g. nice_view_disp) enables CONFIG_ZMK_DISPLAY through that shield's
# own .conf file, and display-less builds keep the ZMK default of n.

# BLE split stack
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y

# Deep sleep timing
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# RGB underglow (PCB has per-key RGB pads)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Prefer higher Bluetooth TX power for a more reliable split link
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
